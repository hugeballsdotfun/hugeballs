# Balls — static site. Generated by setup-domain.sh (DOMAIN is substituted).
# Lives alongside other sites on this server: matched by server_name only,
# never as a default_server.
# Per-IP rate limit for the RPC proxy (http-level directive; this file is
# included inside http {}).
limit_req_zone $binary_remote_addr zone=balls_rpc:10m rate=15r/s;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    root /var/www/balls;
    index index.html;

    # Security headers. X-Frame-Options stops other sites framing the page to
    # trick a wallet click (clickjacking).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- RPC proxy ----------------------------------------------------
    # The browser talks to /rpc (HTTP) and /rpc-ws (WebSocket, used to confirm
    # transactions). The real provider URL — which contains the API key — lives
    # ONLY in /etc/nginx/secrets/balls-rpc.conf on this server (mode 600), so
    # visitors never see it. Only requests that carry this site's own Origin
    # are proxied, and each IP is rate limited.
    location = /rpc {
        limit_req zone=balls_rpc burst=60 nodelay;
        limit_except POST { deny all; }
        client_max_body_size 256k;
        if ($http_origin !~ "^https?://(www\.)?DOMAIN$") { return 403; }
        proxy_http_version 1.1;
        proxy_set_header Content-Type "application/json";
        include /etc/nginx/secrets/balls-rpc.conf;
    }
    location = /rpc-ws {
        limit_req zone=balls_rpc burst=10 nodelay;
        if ($http_origin !~ "^https?://(www\.)?DOMAIN$") { return 403; }
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        include /etc/nginx/secrets/balls-rpc.conf;
    }

    # Code and pages: always revalidate, so a redeploy shows up immediately.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
    # Images: long cache.
    location ~* \.(png|webp|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    # Never serve dotfiles.
    location ~ /\. { deny all; }
}
